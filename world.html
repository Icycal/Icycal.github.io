<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D 职业小镇 · 顾亚辉</title>
<meta name="description" content="以 3D 等距小镇的形式，按时间线浏览顾亚辉的六段职业经历与代表作品。" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230c0f17'/><text x='16' y='23' font-size='17' font-family='sans-serif' font-weight='bold' fill='%233df0d0' text-anchor='middle'>G</text></svg>" />
<link rel="stylesheet" href="styles.css" />
<style>
  html,body{height:100%;overflow:hidden}
  body{background:var(--bg);color:var(--fg)}

  #scene{position:fixed;inset:0;display:block;touch-action:none}

  /* ---------- 顶栏 ---------- */
  .w-top{
    position:fixed;top:0;left:0;right:0;z-index:20;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:14px 20px;
    background:linear-gradient(to bottom,rgba(11,14,22,.92),rgba(11,14,22,0));
    pointer-events:none;
  }
  .w-top > *{pointer-events:auto}
  .w-back{
    display:inline-flex;align-items:center;gap:7px;
    padding:8px 15px;border:1px solid var(--line);border-radius:999px;
    background:rgba(22,27,39,.75);font-size:13px;color:var(--fg);
    backdrop-filter:blur(8px);transition:.2s;
  }
  .w-back:hover{border-color:var(--accent);color:var(--accent)}
  .w-title{font-size:15px;font-weight:600;letter-spacing:.3px}
  .w-sub{font-size:12px;color:var(--muted)}
  .w-tools{margin-left:auto;display:flex;gap:8px}
  .w-btn{
    padding:8px 13px;border:1px solid var(--line);border-radius:999px;
    background:rgba(22,27,39,.75);font-size:12px;color:var(--muted);
    cursor:pointer;backdrop-filter:blur(8px);transition:.2s;font-family:inherit;
  }
  .w-btn:hover{color:var(--fg);border-color:var(--accent)}
  .w-btn.on{color:var(--accent);border-color:var(--accent)}

  /* ---------- 底部提示 ---------- */
  .w-hint{
    position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:20;
    display:flex;gap:16px;flex-wrap:wrap;justify-content:center;
    padding:9px 18px;border:1px solid var(--line);border-radius:999px;
    background:rgba(22,27,39,.8);font-size:12px;color:var(--muted);
    backdrop-filter:blur(8px);max-width:calc(100vw - 32px);
  }
  .w-hint b{color:var(--fg);font-weight:500}

  /* ---------- 悬停浮标 ---------- */
  #tip{
    position:fixed;z-index:25;pointer-events:none;opacity:0;transition:opacity .15s;
    padding:6px 12px;border:1px solid var(--line);border-radius:8px;
    background:rgba(22,27,39,.94);font-size:12px;white-space:nowrap;
    backdrop-filter:blur(8px);transform:translate(-50%,-140%);
  }
  #tip.show{opacity:1}
  #tip i{font-style:normal;color:var(--muted);margin-left:6px;font-size:11px}

  /* ---------- 详情面板 ---------- */
  .w-panel{
    position:fixed;top:0;right:0;bottom:0;z-index:30;width:400px;max-width:92vw;
    background:rgba(17,21,31,.97);border-left:1px solid var(--line);
    backdrop-filter:blur(16px);
    transform:translateX(102%);transition:transform .34s cubic-bezier(.22,.61,.36,1);
    display:flex;flex-direction:column;
  }
  .w-panel.open{transform:translateX(0)}
  .w-panel-head{padding:22px 24px 16px;border-bottom:1px solid var(--line);position:relative}
  .w-bar{position:absolute;left:0;top:0;bottom:0;width:3px}
  .w-period{
    font-family:"SFMono-Regular",Consolas,monospace;font-size:11px;
    letter-spacing:1.4px;color:var(--accent);margin-bottom:7px;
  }
  .w-name{font-size:19px;font-weight:600;line-height:1.35;padding-right:32px}
  .w-role{font-size:13px;color:var(--muted);margin-top:6px}
  .w-close{
    position:absolute;top:18px;right:18px;width:30px;height:30px;
    border:1px solid var(--line);border-radius:50%;background:transparent;
    color:var(--muted);cursor:pointer;font-size:16px;line-height:1;
    display:flex;align-items:center;justify-content:center;transition:.2s;font-family:inherit;
  }
  .w-close:hover{border-color:var(--accent);color:var(--accent)}
  .w-panel-body{padding:18px 24px 28px;overflow-y:auto;flex:1}
  .w-blurb{font-size:13px;color:var(--muted);line-height:1.75;margin-bottom:22px}
  .w-sec{
    font-family:"SFMono-Regular",Consolas,monospace;font-size:11px;
    letter-spacing:1.6px;color:var(--muted);margin:0 0 11px;
  }
  .w-works{display:flex;flex-direction:column;gap:9px;margin-bottom:22px}
  .w-work{
    display:flex;gap:12px;align-items:center;padding:10px;
    border:1px solid var(--line);border-radius:11px;
    background:rgba(22,27,39,.6);transition:.18s;
  }
  .w-work:hover{border-color:var(--accent);background:rgba(61,240,208,.05);transform:translateX(3px)}
  .w-thumb{
    width:52px;height:52px;flex:none;border-radius:8px;overflow:hidden;
    background:rgba(40,48,65,.55);display:flex;align-items:center;justify-content:center;
    font-size:19px;font-weight:600;color:var(--accent);
  }
  .w-thumb img{width:100%;height:100%;object-fit:cover;display:block}
  .w-wt{font-size:13.5px;font-weight:500;line-height:1.4}
  .w-ws{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.45}
  .w-tags{display:flex;flex-wrap:wrap;gap:7px}
  .w-tag{
    padding:5px 11px;border:1px solid var(--line);border-radius:7px;
    font-size:11.5px;color:var(--muted);background:rgba(22,27,39,.5);
  }
  .w-empty{font-size:12.5px;color:var(--muted);font-style:italic}

  /* ---------- 载入 / 降级 ---------- */
  #loading{
    position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:16px;background:var(--bg);
    transition:opacity .5s;
  }
  #loading.hide{opacity:0;pointer-events:none}
  .w-spin{
    width:34px;height:34px;border:2px solid var(--line);
    border-top-color:var(--accent);border-radius:50%;
    animation:spin .9s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  #loading p{font-size:13px;color:var(--muted)}
  #loading .err{color:#ff8b8b;max-width:420px;text-align:center;line-height:1.7}

  #fallback{
    position:fixed;inset:0;z-index:35;overflow-y:auto;
    padding:88px 20px 60px;background:var(--bg);display:none;
  }
  #fallback.show{display:block}
  .fb-wrap{max-width:820px;margin:0 auto}
  .fb-wrap h1{font-size:24px;margin-bottom:8px}
  .fb-note{
    font-size:13px;color:var(--muted);margin-bottom:28px;padding:12px 16px;
    border:1px solid var(--line);border-radius:11px;background:rgba(22,27,39,.6);
  }
  .fb-co{
    border:1px solid var(--line);border-radius:14px;padding:20px 22px;
    margin-bottom:14px;background:rgba(22,27,39,.45);border-left-width:3px;
  }
  .fb-co h2{font-size:17px;margin-bottom:4px}
  .fb-co .fb-meta{font-size:12px;color:var(--accent);margin-bottom:10px;
    font-family:"SFMono-Regular",Consolas,monospace;letter-spacing:.8px}
  .fb-co .fb-role{font-size:13px;color:var(--muted);margin-bottom:10px}
  .fb-co p{font-size:13px;color:var(--muted);line-height:1.75;margin-bottom:14px}
  .fb-links{display:flex;flex-wrap:wrap;gap:8px}
  .fb-links a{
    padding:6px 13px;border:1px solid var(--line);border-radius:8px;
    font-size:12.5px;transition:.18s;
  }
  .fb-links a:hover{border-color:var(--accent);color:var(--accent)}
  .fb-links span{
    padding:6px 13px;border:1px solid var(--line);border-radius:8px;
    font-size:12.5px;color:var(--muted);opacity:.65;
  }

  @media (max-width:760px){
    .w-panel{
      top:auto;left:0;right:0;bottom:0;width:100%;max-width:100%;
      height:74vh;border-left:none;border-top:1px solid var(--line);
      border-radius:18px 18px 0 0;transform:translateY(102%);
    }
    .w-panel.open{transform:translateY(0)}
    .w-hint{font-size:11px;gap:11px;padding:7px 13px;bottom:10px}
    .w-title{display:none}
    .w-panel-head{padding:18px 20px 14px}
    .w-panel-body{padding:16px 20px 32px}
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div class="w-top">
  <a class="w-back" href="index.html">← 返回主页</a>
  <div>
    <div class="w-title">3D 职业小镇</div>
    <div class="w-sub">按时间线漫步六段经历，点房子看作品</div>
  </div>
  <div class="w-tools">
    <button class="w-btn" id="btn-spin">自动旋转</button>
    <button class="w-btn" id="btn-reset">重置视角</button>
  </div>
</div>

<div class="w-hint">
  <span><b>拖拽</b> 旋转</span>
  <span><b>滚轮</b> 缩放</span>
  <span><b>点击房子</b> 看作品</span>
</div>

<div id="tip"></div>

<aside class="w-panel" id="panel">
  <div class="w-panel-head">
    <div class="w-bar" id="p-bar"></div>
    <div class="w-period" id="p-period"></div>
    <div class="w-name" id="p-name"></div>
    <div class="w-role" id="p-role"></div>
    <button class="w-close" id="p-close" aria-label="关闭">×</button>
  </div>
  <div class="w-panel-body">
    <p class="w-blurb" id="p-blurb"></p>
    <p class="w-sec" id="p-works-sec">代表作品</p>
    <div class="w-works" id="p-works"></div>
    <p class="w-sec" id="p-extra-sec">其他项目</p>
    <div class="w-tags" id="p-extra"></div>
  </div>
</aside>

<div id="loading">
  <div class="w-spin"></div>
  <p id="load-msg">正在搭建小镇…</p>
</div>

<div id="fallback">
  <div class="fb-wrap">
    <h1>职业时间线</h1>
    <p class="fb-note">
      你的浏览器不支持 WebGL，3D 小镇无法显示。下面是同样的内容，按时间线排列，点击作品可直接查看详情。
    </p>
    <div id="fb-list"></div>
  </div>
</div>

<!-- 自检探针：把渲染结果写进 DOM，便于 headless 环境验证（正常访问时不可见） -->
<div id="diag" hidden></div>

<script src="data.js?v=covicon16"></script>
<script>
/* ============================================================
   降级用的文字时间线
   刻意放在普通 script 里：three.js 是 ES module，一旦它加载失败
   （网络问题 / 被拦截），module 整体不会执行，降级逻辑必须能独立跑。
   ============================================================ */
(function () {
  var SITE = window.SITE || {};
  var COMPANIES = SITE.companies || [];
  var PROJECTS = SITE.projects || [];
  var bySlug = {};
  PROJECTS.forEach(function (p) { bySlug[p.slug] = p; });

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
  }
  window.esc = esc;

  /* 自检：把结果 JSON 写进 #diag，headless 下 dump-dom 就能读到 */
  window.__diag = { ok: null, reason: null, at: new Date().toISOString() };
  function writeDiag(patch) {
    Object.assign(window.__diag, patch);
    var d = document.getElementById('diag');
    if (d) d.textContent = JSON.stringify(window.__diag);
  }
  window.__writeDiag = writeDiag;
  writeDiag({ companies: COMPANIES.length, projects: PROJECTS.length });

  window.showFallback = function (reason) {
    writeDiag({ ok: false, reason: reason || 'fallback' });
    var loading = document.getElementById('loading');
    var scene = document.getElementById('scene');
    var hint = document.querySelector('.w-hint');
    var tools = document.querySelector('.w-tools');
    var fb = document.getElementById('fallback');
    if (!fb || fb.classList.contains('show')) return;

    if (loading) loading.style.display = 'none';
    if (scene) scene.style.display = 'none';
    if (hint) hint.style.display = 'none';
    if (tools) tools.style.display = 'none';

    var note = document.querySelector('.fb-note');
    if (note && reason) {
      note.textContent = '3D 小镇无法显示（' + reason + '）。下面是同样的内容，按时间线排列，点击作品可直接查看详情。';
    }

    var box = document.getElementById('fb-list');
    box.innerHTML = COMPANIES.map(function (c) {
      var links = (c.works || []).map(function (s) {
        var p = bySlug[s];
        return p ? '<a href="work.html?slug=' + encodeURIComponent(s) + '">' + esc(p.title || s) + '</a>' : '';
      }).join('');
      var tags = (c.extraProjects || []).map(function (t) {
        return '<span>' + esc(t) + '</span>';
      }).join('');
      return '<div class="fb-co" style="border-left-color:' + esc(c.tint) + '">' +
        '<h2>' + esc(c.name) + '</h2>' +
        '<div class="fb-meta">' + esc(c.period) + '</div>' +
        '<div class="fb-role">' + esc(c.role) + (c.dept ? ' · ' + esc(c.dept) : '') + '</div>' +
        '<p>' + esc(c.blurb) + '</p>' +
        '<div class="fb-links">' + links + tags + '</div>' +
        '</div>';
    }).join('');
    fb.classList.add('show');
  };
})();
</script>
<script type="module">
/* 标记模块已开始执行：外面的超时守卫据此判断
   ——「还没下载完」和「已经在建场景了」要区别对待，后者应多给点时间 */
window.__worldStarted = true;

import * as THREE from 'https://icycal.github.io/gu-videos/vendor/three.module.min.js';

/* ============================================================
   数据
   ============================================================ */
const SITE = window.SITE || {};
const COMPANIES = SITE.companies || [];
const PROJECTS = SITE.projects || [];
const bySlug = {};
PROJECTS.forEach(p => { bySlug[p.slug] = p; });

/* ============================================================
   WebGL 可用性检测 —— 不支持就降级成纯文字时间线
   ============================================================ */
function hasWebGL() {
  try {
    const c = document.createElement('canvas');
    return !!(window.WebGLRenderingContext &&
      (c.getContext('webgl2') || c.getContext('webgl') || c.getContext('experimental-webgl')));
  } catch (e) { return false; }
}

if (!hasWebGL() || !COMPANIES.length) { window.showFallback(); }

/* ============================================================
   如果支持 WebGL，开始搭 3D 场景
   ============================================================ */
if (hasWebGL() && COMPANIES.length) {
  try { boot(); }
  catch (err) {
    console.error('[world] boot failed:', err);
    if (window.showFallback) window.showFallback('场景初始化失败');
  }
}

function boot() {
  const canvas = document.getElementById('scene');
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  if ('outputColorSpace' in renderer) renderer.outputColorSpace = THREE.SRGBColorSpace;

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b0e16);
  scene.fog = new THREE.Fog(0x0b0e16, 78, 165);

  /* ---------- 等距正交相机 ---------- */
  let frustum = 46;
  const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 600);

  const target = new THREE.Vector3(0, 3, 0);
  const targetGoal = new THREE.Vector3(0, 3, 0);
  let theta = Math.PI * 0.25;
  let phi = Math.atan(Math.SQRT2);   // 54.7° —— 标准等距仰角
  let autoSpin = false;

  const DEF = { theta, phi, target: new THREE.Vector3(0, 3, 0), frustum: 46 };

  function resize() {
    const w = innerWidth, h = innerHeight;
    renderer.setSize(w, h, false);
    const a = w / h;
    camera.left = -frustum * a; camera.right = frustum * a;
    camera.top = frustum; camera.bottom = -frustum;
    camera.updateProjectionMatrix();
  }

  function updateCamera() {
    const r = 130;
    camera.position.set(
      target.x + r * Math.sin(phi) * Math.sin(theta),
      target.y + r * Math.cos(phi),
      target.z + r * Math.sin(phi) * Math.cos(theta)
    );
    camera.lookAt(target);
  }

  /* ---------- 灯光：黄昏 + 冷色环境 ---------- */
  scene.add(new THREE.AmbientLight(0x5a6a94, 1.05));
  const hemi = new THREE.HemisphereLight(0x8fb6ff, 0x1b2b22, 0.62);
  scene.add(hemi);

  const sun = new THREE.DirectionalLight(0xffd7a8, 1.85);
  sun.position.set(38, 52, 26);
  sun.castShadow = true;
  sun.shadow.mapSize.set(2048, 2048);
  sun.shadow.camera.near = 1;
  sun.shadow.camera.far = 190;
  const S = 62;
  sun.shadow.camera.left = -S; sun.shadow.camera.right = S;
  sun.shadow.camera.top = S; sun.shadow.camera.bottom = -S;
  sun.shadow.bias = -0.0006;
  sun.shadow.normalBias = 0.028;
  scene.add(sun);

  /* 夜色补光，让背光面不死黑 */
  const rim = new THREE.DirectionalLight(0x7c5cff, 0.5);
  rim.position.set(-34, 22, -30);
  scene.add(rim);

  /* ============================================================
     建模工具
     ============================================================ */
  const mat = (color, opt) => new THREE.MeshStandardMaterial(
    Object.assign({ color: new THREE.Color(color), roughness: .82, metalness: .04 }, opt || {}));

  /* 人字屋顶（两坡 + 两片山墙） */
  function gableRoof(w, d, h, rh) {
    const hw = w / 2, hd = d / 2, ty = h + rh;
    const v = new Float32Array([
      /* 左坡（法线朝左上） */
      -hw, h, -hd, -hw, h, hd, 0, ty, hd,
      -hw, h, -hd, 0, ty, hd, 0, ty, -hd,
      /* 右坡（法线朝右上） */
      hw, h, hd, hw, h, -hd, 0, ty, -hd,
      hw, h, hd, 0, ty, -hd, 0, ty, hd,
      /* 前山墙（法线朝 +Z） */
      -hw, h, hd, hw, h, hd, 0, ty, hd,
      /* 后山墙（法线朝 -Z） */
      hw, h, -hd, -hw, h, -hd, 0, ty, -hd
    ]);
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(v, 3));
    g.computeVertexNormals();
    return g;
  }

  /* 确定性伪随机，保证每次刷新树的位置一致 */
  function rnd(seed) {
    const x = Math.sin(seed * 127.1 + 311.7) * 43758.5453;
    return x - Math.floor(x);
  }

  /* 路牌：canvas 画字 → 贴图 → 立在柱子前 */
  function makeSign(title, sub, tint) {
    const g = new THREE.Group();
    const c = document.createElement('canvas');
    c.width = 320; c.height = 108;
    const x = c.getContext('2d');
    x.fillStyle = '#141926'; x.fillRect(0, 0, 320, 108);
    x.fillStyle = tint; x.fillRect(0, 0, 320, 5);
    x.textAlign = 'center'; x.textBaseline = 'middle';
    x.fillStyle = '#eef3fa';
    x.font = '600 40px "PingFang SC","Microsoft YaHei",sans-serif';
    x.fillText(title, 160, 44);
    x.fillStyle = '#93a6c4';
    x.font = '26px "SFMono-Regular",Consolas,monospace';
    x.fillText(sub, 160, 84);
    const tex = new THREE.CanvasTexture(c);
    if ('colorSpace' in tex) tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = 4;
    const board = new THREE.Mesh(
      new THREE.PlaneGeometry(4.2, 1.42),
      new THREE.MeshBasicMaterial({ map: tex })
    );
    board.position.y = 2.55;
    g.add(board);
    const pole = new THREE.Mesh(
      new THREE.CylinderGeometry(.11, .11, 2.6, 8),
      mat('#2b3346', { roughness: .95 })
    );
    pole.position.y = 1.05;
    pole.castShadow = true;
    g.add(pole);
    return g;
  }

  /* 一棵树 */
  function makeTree(scale) {
    const g = new THREE.Group();
    const trunk = new THREE.Mesh(
      new THREE.CylinderGeometry(.22 * scale, .3 * scale, 1.9 * scale, 7),
      mat('#3d3226', { roughness: .96 })
    );
    trunk.position.y = .95 * scale;
    trunk.castShadow = true;
    g.add(trunk);
    const green = ['#2f6b45', '#27603c', '#35734c'][Math.floor(rnd(scale * 31) * 3)];
    for (let i = 0; i < 3; i++) {
      const r = (1.5 - i * .34) * scale;
      const cone = new THREE.Mesh(
        new THREE.ConeGeometry(r, 1.5 * scale, 8),
        mat(green, { roughness: .92 })
      );
      cone.position.y = (2.0 + i * .92) * scale;
      cone.rotation.y = rnd(scale * 7 + i) * 6.28;
      cone.castShadow = true;
      g.add(cone);
    }
    return g;
  }

  /* ============================================================
     地面 + 道路
     ============================================================ */
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(320, 320),
    mat('#1d3327', { roughness: .98 })
  );
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);

  const road = new THREE.Mesh(
    new THREE.PlaneGeometry(78, 6.4),
    mat('#2a3040', { roughness: .95 })
  );
  road.rotation.x = -Math.PI / 2;
  road.position.y = 0.02;
  road.receiveShadow = true;
  scene.add(road);

  /* 路中央的虚线 */
  for (let i = -34; i <= 34; i += 4.6) {
    const dash = new THREE.Mesh(
      new THREE.PlaneGeometry(2.3, .26),
      new THREE.MeshBasicMaterial({ color: 0x4a5570 })
    );
    dash.rotation.x = -Math.PI / 2;
    dash.position.set(i, 0.04, 0);
    scene.add(dash);
  }

  /* ============================================================
     房子：沿主路两侧 S 形排布（时间顺序）
     北侧 z=-13 由西向东，南侧 z=+13 由东向西
     ============================================================ */
  const SLOT_X = [-21, 0, 21];
  const houses = [];

  COMPANIES.forEach((co, i) => {
    const north = i < 3;
    const k = north ? i : (COMPANIES.length - 1 - i);   // 南侧反向，形成 S 形
    const x = SLOT_X[k % 3];
    const z = north ? -13 : 13;
    const n = (co.works || []).length + (co.extraProjects || []).length;
    const w = 7.2 + Math.min(n, 8) * .42;
    const d = 6.4 + Math.min(n, 8) * .30;
    const h = 4.4 + Math.min(n, 8) * .40;
    const rh = 3.0 + Math.min(n, 8) * .18;

    const g = new THREE.Group();
    g.position.set(x, 0, z);
    /* 南侧房子转 180°，门朝路 */
    if (!north) g.rotation.y = Math.PI;

    /* 地基 */
    const base = new THREE.Mesh(
      new THREE.BoxGeometry(w + 1.5, .5, d + 1.5),
      mat('#2c3446', { roughness: .95 })
    );
    base.position.y = .25;
    base.receiveShadow = true; base.castShadow = true;
    g.add(base);

    /* 主体 */
    const body = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, d),
      mat(co.tint, { roughness: .72 })
    );
    body.position.y = .5 + h / 2;
    body.castShadow = true; body.receiveShadow = true;
    g.add(body);

    /* 屋顶 */
    const roof = new THREE.Mesh(gableRoof(w, d, .5 + h, rh), mat(co.roof, { roughness: .8 }));
    roof.castShadow = true;
    g.add(roof);

    /* 烟囱 */
    const chim = new THREE.Mesh(
      new THREE.BoxGeometry(.85, 2.1, .85),
      mat('#3a4256', { roughness: .9 })
    );
    chim.position.set(w * .27, .5 + h + rh * .78, -d * .16);
    chim.castShadow = true;
    g.add(chim);

    /* 门（暖色发光，像屋里亮着灯） */
    const door = new THREE.Mesh(
      new THREE.BoxGeometry(1.55, 2.5, .18),
      new THREE.MeshStandardMaterial({
        color: 0xffc987, emissive: 0xffab5e, emissiveIntensity: .95, roughness: .6
      })
    );
    door.position.set(0, .5 + 1.25, d / 2 + .09);
    g.add(door);

    /* 窗（发光） */
    const winMat = new THREE.MeshStandardMaterial({
      color: 0xfff0cf, emissive: 0xffcf8a, emissiveIntensity: 1.15, roughness: .35
    });
    const rows = Math.max(1, Math.round((h - 1.4) / 2.3));
    for (let r = 0; r < rows; r++) {
      for (const sx of [-1, 1]) {
        const win = new THREE.Mesh(new THREE.BoxGeometry(1.25, 1.25, .16), winMat);
        win.position.set(sx * (w * .27), .5 + 1.7 + r * 2.3, d / 2 + .09);
        g.add(win);
        const side = new THREE.Mesh(new THREE.BoxGeometry(.16, 1.15, 1.3), winMat);
        side.position.set(sx * (w / 2 + .08), .5 + 1.7 + r * 2.3, -d * .1);
        g.add(side);
      }
    }

    /* 门前小路 */
    const path = new THREE.Mesh(
      new THREE.PlaneGeometry(2.2, 5.4),
      mat('#313a4e', { roughness: .96 })
    );
    path.rotation.x = -Math.PI / 2;
    path.position.set(0, .03, d / 2 + 3.2);
    g.add(path);

    /* 路牌：年份 + 公司简称 */
    const yr = (co.start || '').slice(0, 4);
    const yrEnd = co.end ? co.end.slice(0, 4) : '今';
    const sign = makeSign(co.short || co.name, yr + '–' + yrEnd, co.tint);
    sign.position.set(w * .5 + 1.5, 0, d * .5 + 2.2);
    g.add(sign);

    /* 房前小灯，暖黄 */
    const lamp = new THREE.PointLight(0xffb877, 12, 16, 2);
    lamp.position.set(0, 3.6, d / 2 + 1.4);
    g.add(lamp);

    scene.add(g);

    /* 拾取用的隐形包围盒：覆盖整栋房，点击手感更宽容 */
    const hit = new THREE.Mesh(
      new THREE.BoxGeometry(w + 2.6, h + rh + 1.6, d + 2.6),
      new THREE.MeshBasicMaterial({ visible: false })
    );
    hit.position.set(x, (.5 + h + rh) / 2 + .4, z);
    hit.userData.co = co;
    hit.userData.group = g;
    hit.userData.baseY = 0;
    scene.add(hit);
    houses.push(hit);
  });

  /* ============================================================
     树 & 石头：避开房子与路
     ============================================================ */
  const blocked = [];
  houses.forEach(h => blocked.push(h.position));

  function farEnough(x, z, min) {
    if (Math.abs(z) < 8.5) return false;            // 主路
    if (Math.abs(x) > 40 || Math.abs(z) > 27) return false;
    for (const b of blocked) {
      const dx = x - b.x, dz = z - b.z;
      if (Math.sqrt(dx * dx + dz * dz) < min) return false;
    }
    return true;
  }

  let placed = 0;
  for (let i = 0; i < 700 && placed < 46; i++) {
    const x = (rnd(i * 1.7) - .5) * 86;
    const z = (rnd(i * 3.3 + 9) - .5) * 58;
    if (!farEnough(x, z, 9.5)) continue;
    const t = makeTree(.75 + rnd(i * 5.1) * .75);
    t.position.set(x, 0, z);
    scene.add(t);
    placed++;
  }

  for (let i = 0; i < 26; i++) {
    const x = (rnd(i * 2.9 + 41) - .5) * 80;
    const z = (rnd(i * 4.7 + 77) - .5) * 54;
    if (!farEnough(x, z, 7)) continue;
    const s = .3 + rnd(i * 6.3) * .45;
    const rock = new THREE.Mesh(
      new THREE.DodecahedronGeometry(s, 0),
      mat('#39414f', { roughness: .97 })
    );
    rock.position.set(x, s * .45, z);
    rock.rotation.set(rnd(i) * 3, rnd(i + 1) * 3, rnd(i + 2) * 3);
    rock.castShadow = true;
    scene.add(rock);
  }

  /* ============================================================
     交互：hover 高亮 + 点击选中
     ============================================================ */
  const ray = new THREE.Raycaster();
  const ptr = new THREE.Vector2();
  const tip = document.getElementById('tip');
  let hovered = null, selected = null;
  let dragging = false, moved = 0, lastX = 0, lastY = 0;

  canvas.addEventListener('pointerdown', e => {
    dragging = true; moved = 0;
    lastX = e.clientX; lastY = e.clientY;
    canvas.setPointerCapture(e.pointerId);
  });

  canvas.addEventListener('pointermove', e => {
    if (dragging) {
      const dx = e.clientX - lastX, dy = e.clientY - lastY;
      moved += Math.abs(dx) + Math.abs(dy);
      theta -= dx * 0.006;
      phi = Math.min(Math.PI * 0.47, Math.max(0.20, phi - dy * 0.005));
      lastX = e.clientX; lastY = e.clientY;
      return;
    }
    ptr.x = (e.clientX / innerWidth) * 2 - 1;
    ptr.y = -(e.clientY / innerHeight) * 2 + 1;
    ray.setFromCamera(ptr, camera);
    const hits = ray.intersectObjects(houses, false);
    const h = hits.length ? hits[0].object : null;
    if (h !== hovered) {
      hovered = h;
      canvas.style.cursor = h ? 'pointer' : 'grab';
    }
    if (h) {
      const co = h.userData.co;
      const cnt = (co.works || []).length;
      tip.innerHTML = esc(co.short || co.name) +
        (cnt ? `<i>${cnt} 个作品</i>` : `<i>${(co.extraProjects || []).length} 个项目</i>`);
      tip.style.left = e.clientX + 'px';
      tip.style.top = e.clientY + 'px';
      tip.classList.add('show');
    } else {
      tip.classList.remove('show');
    }
  });

  canvas.addEventListener('pointerup', e => {
    dragging = false;
    if (moved > 7) return;                    // 拖动过就不算点击
    ptr.x = (e.clientX / innerWidth) * 2 - 1;
    ptr.y = -(e.clientY / innerHeight) * 2 + 1;
    ray.setFromCamera(ptr, camera);
    const hits = ray.intersectObjects(houses, false);
    if (hits.length) { select(hits[0].object); }
    else { closePanel(); }
  });

  canvas.addEventListener('pointerleave', () => {
    dragging = false; hovered = null; tip.classList.remove('show');
  });

  canvas.addEventListener('wheel', e => {
    e.preventDefault();
    frustum = Math.min(88, Math.max(18, frustum * (1 + Math.sign(e.deltaY) * 0.09)));
    resize();
  }, { passive: false });

  /* 双指缩放 */
  let pinch = 0;
  canvas.addEventListener('touchmove', e => {
    if (e.touches.length !== 2) return;
    e.preventDefault();
    const dx = e.touches[0].clientX - e.touches[1].clientX;
    const dy = e.touches[0].clientY - e.touches[1].clientY;
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (pinch) {
      frustum = Math.min(88, Math.max(18, frustum * (pinch / dist)));
      resize();
    }
    pinch = dist;
  }, { passive: false });
  canvas.addEventListener('touchend', () => { pinch = 0; });

  /* ============================================================
     面板
     ============================================================ */
  const panel = document.getElementById('panel');

  function select(hit) {
    selected = hit;
    const co = hit.userData.co;
    document.getElementById('p-bar').style.background = co.tint;
    document.getElementById('p-period').textContent = co.period || '';
    document.getElementById('p-name').textContent = co.name || '';
    document.getElementById('p-role').textContent =
      co.role + (co.dept ? ' · ' + co.dept : '');
    document.getElementById('p-blurb').textContent = co.blurb || '';

    const works = (co.works || []).map(s => bySlug[s]).filter(Boolean);
    const worksBox = document.getElementById('p-works');
    if (works.length) {
      worksBox.innerHTML = works.map(p => {
        const raw = (p.cover && p.cover.src) || '';
        const isImg = raw && /\.(webp|png|jpe?g|gif|svg)(\?|$)/i.test(raw);
        const thumb = isImg
          ? `<img src="${esc(raw)}" alt="" loading="lazy">`
          : `<span>${esc((p.title || '?').trim().charAt(0))}</span>`;
        return `<a class="w-work" href="work.html?slug=${encodeURIComponent(p.slug)}">
          <div class="w-thumb">${thumb}</div>
          <div>
            <div class="w-wt">${esc(p.title)}</div>
            <div class="w-ws">${esc(p.summary || p.stack || '')}</div>
          </div>
        </a>`;
      }).join('');
      document.getElementById('p-works-sec').style.display = '';
    } else {
      worksBox.innerHTML = `<p class="w-empty">这家的项目还没单独建主页，见下方清单。</p>`;
      document.getElementById('p-works-sec').style.display = 'none';
    }

    const extra = co.extraProjects || [];
    document.getElementById('p-extra').innerHTML =
      extra.length ? extra.map(t => `<span class="w-tag">${esc(t)}</span>`).join('')
        : `<span class="w-tag">—</span>`;
    document.getElementById('p-extra-sec').style.display = extra.length ? '' : 'none';
    document.getElementById('p-extra').style.display = extra.length ? '' : 'none';

    panel.classList.add('open');
    /* 镜头推近这栋房 */
    const p = hit.position;
    targetGoal.set(p.x, 3.2, p.z);
  }

  function closePanel() {
    panel.classList.remove('open');
    selected = null;
    targetGoal.copy(DEF.target);
  }

  document.getElementById('p-close').addEventListener('click', closePanel);
  addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });

  /* 工具栏 */
  const btnSpin = document.getElementById('btn-spin');
  btnSpin.addEventListener('click', () => {
    autoSpin = !autoSpin;
    btnSpin.classList.toggle('on', autoSpin);
  });
  document.getElementById('btn-reset').addEventListener('click', () => {
    theta = DEF.theta; phi = DEF.phi; frustum = DEF.frustum;
    targetGoal.copy(DEF.target);
    resize();
    closePanel();
  });

  /* ============================================================
     渲染循环
     ============================================================ */
  let t0 = 0;
  function loop() {
    requestAnimationFrame(loop);
    if (autoSpin && !dragging) theta += 0.0016;
    target.lerp(targetGoal, 0.075);
    updateCamera();

    /* 悬停的房子微微浮起 */
    houses.forEach(h => {
      const g = h.userData.group;
      const want = (h === hovered || h === selected) ? 0.55 : 0;
      g.position.y += (want - g.position.y) * 0.16;
    });

    renderer.render(scene, camera);
  }

  addEventListener('resize', resize);
  resize();
  updateCamera();
  loop();

  /* 首帧渲染完成后再收起 loading，避免出现黑屏闪烁 */
  requestAnimationFrame(() => requestAnimationFrame(() => {
    document.getElementById('loading').classList.add('hide');

    /* 自检数据：headless 下把渲染状态写进 #diag 供 dump-dom 读取 */
    try {
      const gl = renderer.getContext();
      const dbg = gl.getExtension('WEBGL_debug_renderer_info');
      const payload = {
        ok: true,
        houses: houses.length,
        sceneChildren: scene.children.length,
        drawCalls: renderer.info.render.calls,
        triangles: renderer.info.render.triangles,
        glVersion: gl.getParameter(gl.VERSION),
        glRenderer: dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : 'n/a',
        canvas: renderer.domElement.width + 'x' + renderer.domElement.height
      };
      if (window.__worldReady) window.__worldReady(payload);
    } catch (e) {
      if (window.__worldReady) window.__worldReady({ ok: true, warn: String(e && e.message) });
    }

    setTimeout(() => { document.getElementById('loading').style.display = 'none'; }, 520);
  }));

}
</script>
<script>
/* ============================================================
   最后一道保险
   three.js 是外部 ES module：网络慢、被拦截、或 GPU 初始化失败时，
   module 可能永远跑不到收起 loading 的那一步。这里超时兜底切文字版，
   保证内容在任何情况下都可读、可被搜索引擎抓到。
   ============================================================ */
(function () {
  var done = false;
  window.__worldReady = function (payload) {
    done = true;
    if (window.__writeDiag) window.__writeDiag(Object.assign({ ok: true }, payload || {}));
  };

  setTimeout(function () {
    if (done) return;
    var l = document.getElementById('loading');
    if (!l || l.classList.contains('hide')) return;
    var msg = document.getElementById('load-msg');
    if (msg) msg.innerHTML = '<span class="err">3D 场景加载较慢，正在切换为文字版时间线…</span>';
    setTimeout(function () {
      if (!done) window.showFallback('加载超时');
    }, 4000);
  }, 10000);
})();
</script>
</body>
</html>
