<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>作品 · 顾亚辉</title>
<meta name="description" content="作品列表 — 静态网页 / 图片 / 视频等多种形式的项目展示" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div id="cursor-glow"></div>
<canvas id="spark-canvas"></canvas>
<div id="progress"></div>

<nav>
  <div class="wrap">
    <div class="brand" id="brand"></div>
    <div class="navlinks">
      <a href="index.html">首页</a>
      <a href="works.html" class="active">作品</a>
    </div>
  </div>
</nav>

<main class="wrap" style="padding-top:48px;padding-bottom:48px">
  <div class="reveal" style="margin-bottom:26px">
    <div class="sec-title">作品集</div>
    <div class="sec-sub">Works · 点击封面查看详情（含静态网页 / 图片 / 视频等）</div>
  </div>
  <div class="work-grid" id="workGrid"></div>
  <div class="works-empty" id="workEmpty" style="display:none">还没有作品，去 data.js 的 projects 数组里加一个吧。</div>
</main>

<footer>
  <div class="wrap">© <span id="year"></span> <span id="deployNote"></span></div>
</footer>

<script src="data.js?v=covicon2"></script>
<script src="site.js"></script>
<script>
(function(){
  "use strict";
  try {
  var S = window.SITE, esc = window.SiteKit && window.SiteKit.esc;
  if (!esc) esc = function(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  if (!S){ document.getElementById('workGrid').innerHTML = '<p style="color:#9aa6bd">内容加载失败：未找到 data.js</p>'; return; }

  var brandName = esc(S.profile.name), hi = esc(S.profile.nameAccent);
  if (hi) brandName = brandName.split(hi).join('<span>'+hi+'</span>');
  document.getElementById('brand').innerHTML = brandName;
  document.getElementById('deployNote').textContent = S.profile.deployNote || '由 Gitee Pages 部署';
  document.getElementById('year').textContent = new Date().getFullYear();

  var VER = '20260823-1920';
  function coverHTML(p){
    var href = 'work.html?slug=' + encodeURIComponent(p.slug || '') + '&v=' + VER;
    var c = p.cover || {kind:'none'};
    var inner, badge = '', extraCls = '', styleAttr = '';
    if (c.kind === 'image'){
      // coverFit 默认 cover（满铺封面），对裁切过白边的 logo 图用 contain 让其完整显示
      var fit = c.coverFit === 'contain' ? 'contain' : 'cover';
      var bg = c.coverBg || '';
      // 对 contain 模式的封面（如裁切过的 logo），用 padding:40px 让其居中而不贴边
      var imgStyle = fit === 'contain' ? ' object-fit:contain;width:calc(100% - 60px);max-height:calc(100% - 60px);height:auto;' : '';
      var bgStyle = bg ? 'background:' + bg + ';' : '';
      extraCls = fit === 'contain' ? ' has-fit-contain' : '';
      badge = '<span class="kind-badge">图片</span>';
      inner = '<img class="cover-media" src="' + esc(c.src) + '" alt="' + esc(p.title) + '" style="' + imgStyle + '">';
      styleAttr = bgStyle ? ' style="' + bgStyle + '"' : '';
    } else if (c.kind === 'video'){
      inner = '<video class="cover-media" src="' + esc(c.src) + '" muted preload="metadata"></video><div class="cover-play">▶</div>';
      badge = '<span class="kind-badge">视频</span>';
    } else if (c.kind === 'icon'){
      // 图标作为 cover-link 自身的背景图，配合 background-size 放大并裁掉 logo 周围白边
      styleAttr = ' style="background-image:url(' + esc(c.src) + ')"';
      extraCls = ' has-icon';
    } else {
      inner = '<div class="cover-ph">' + esc((p.title||'?').charAt(0)) + '</div>';
    }
    return '<a class="cover-link'+extraCls+'" href="'+href+'"'+styleAttr+'>'+badge+inner+'</a>';
  }

  var list = S.projects || [];
  if (!list.length){ document.getElementById('workEmpty').style.display = 'block'; return; }

  document.getElementById('workGrid').innerHTML = list.map(function(p){
    var summary = p.summary || (p.desc ? p.desc.slice(0,60) + (p.desc.length>60?'…':'') : '');
    return '<div class="work-card">'+
      coverHTML(p)+
      '<div class="body">'+
        '<h3><a href="work.html?slug=' + encodeURIComponent(p.slug||'') + '&v=' + VER + '">' + esc(p.title) + '</a></h3>'+
        '<p>' + esc(summary) + '</p>'+
        '<div class="meta"><span class="stack">' + esc(p.stack||'') + '</span>'+
          '<a class="go" href="work.html?slug=' + encodeURIComponent(p.slug||'') + '&v=' + VER + '">查看详情 →</a></div>'+
      '</div>'+
    '</div>';
  }).join('');
  } catch(err){
    try { console.error('[works.html] 渲染异常：', err); } catch(_){}
    var g = document.getElementById('workGrid');
    if (g) g.innerHTML = '<p style="color:#ff8a8a">作品列表渲染异常，请按 Ctrl+Shift+R 强制刷新。<br><small>'+(err&&err.message||err)+'</small></p>';
  }
})();
</script>
</body>
</html>
